# 设置token超时时间(秒)
token:
  expiration-s: 3600

picture:
  localorcloud: localPictureSave
  localoriginPath: file:D:/picture/
  mappinglocaloriginPath: /localPicture/**
  feedback:
    path: D:/picture/feedback
    mappingPath: http://localhost:${server.port}/localPicture/feedback/
  animation:
    path: D:\picture\animation
    mappingPath: http://localhost:${server.port}/localPicture/animation/  #映射地址
  comic:
    path: D:\picture\comic
    mappingPath: http://localhost:${server.port}/localPicture/comic/
  novel:
    path: D:\picture\novel
    mappingPath: http://localhost:${server.port}/localPicture/novel/
  game:
    path: D:\picture\game
    mappingPath: http://localhost:${server.port}/localPicture/game/
  carousel:
    path: D:\picture\carousel
    mappingPath: http://localhost:${server.port}/localPicture/carousel/
  user:
    path: D:\picture\user
    mappingPath: http://localhost:${server.port}/localPicture/user/
  other:
    path: D:\picture\other
    mappingPath: http://localhost:${server.port}/localPicture/other/

# ==================== 聊天室配置 ====================
chat:
  # 单条消息最大长度（前端 UI 也应同步）
  message:
    max-length: 500
  # 发送频率限制（每用户）
  rate-limit:
    per-second: 5     # 每秒最多 5 条
    per-minute: 30    # 每分钟最多 30 条
  # 定时清理（防止表无限增长）
  cleanup:
    enabled: true
    retention-days: 30  # 只保留 30 天

